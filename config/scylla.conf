# Scylla shared config. ZMK strips the _left/_right suffix when matching files
# in config/, so this one file configures scylla_left and scylla_right alike.
#
# NOTE: boards/shields/scylla/*.conf is NOT read by ZMK -- shared (unsuffixed)
# config files in a shield folder are unsupported. An earlier
# boards/shields/scylla/scylla.conf set these same two options and was silently
# ignored, which is what caused the fault below. Keep them here.
#
# The next two options are load-bearing. Do not remove them as redundant.
#
# CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y
#   ZMK v0.3's UART-mode Kconfig choice has NO default. On nRF52 the ASYNC
#   option is visible (CONFIG_SERIAL_SUPPORT_ASYNC=y) and is listed FIRST, so
#   with no mode set it is selected with no warnings at all. Async UARTE RX
#   overruns on nRF52 under Zephyr 3.5; together with an unwanted BLE transport
#   this caused intermittent right-half key latching (fixed 2026-09-26).
#   Piantor is not a valid reference here: async is unavailable on RP2040, so
#   it resolved to INTERRUPT by accident rather than by configuration.
#
# CONFIG_ZMK_BLE=n
#   Wired-only keyboard. Also renders CONFIG_ZMK_SPLIT_BLE invisible (it depends
#   on ZMK_BLE) rather than merely n, leaving wired as the sole transport.
#
# Regression symptom: right-half keys latch; a left-half press clears them.
# Verify after any change -- build log must show
# CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y, with
# CONFIG_ZMK_SPLIT_WIRED_UART_MODE_ASYNC and CONFIG_ZMK_BLE both absent.

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y
CONFIG_ZMK_BLE=n
